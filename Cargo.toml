[package]
name = "norlundcalc"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "norlundcalc"
crate-type = ["rlib"]

[[bin]]
name = "norlundcalc-cli"
path = "src/main.rs"

[[bin]]
name = "norlundcalc-web"
path = "src/web.rs"
required-features = ["cli"]

[features]
default = ["cli", "parallel"]

# rayon; off for wasm32-wasip1, which has no threads
parallel = [
  "dep:rayon",
]

# CLI plotting dependencies
cli = [
  "dep:tiny-skia",
  "dep:fontdue",
  "dep:png",
  "dep:rustix",
]

# Python bindings
python = [
  "dep:pyo3",
]

[dependencies]
num-complex = "0.4"
rayon = { version = "1.10", optional = true }
formulac = "0.9.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"], optional = true }
fontdue = { version = "0.9", optional = true }
png = { version = "0.18.1", optional = true }
pyo3 = { version = "0.30", features = ["num-complex"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
