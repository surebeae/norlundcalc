[package]
name = "norlundcalc"
version = "0.2.0"
edition = "2021"

[lib]
name = "norlundcalc"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]

# CLI plotting dependencies
cli = [
  "dep:kuva",
  "dep:icy_sixel",
  "dep:image",
  "dep:terminal_size",
]

# Python bindings
python = [
  "dep:pyo3",
]

[dependencies]
num-complex = "0.4"
gauss-quad = { version = "0.3", features = ["rayon"] }
rayon = "1.10"
formulac = "0.8"

kuva = { version = "0.5", features = ["png"], optional = true }
icy_sixel = { version = "0.5.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
terminal_size = { version = "0.4", optional = true }

pyo3 = { version = "0.29.2", features = ["num-complex"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
